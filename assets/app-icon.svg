<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <title>Media Share</title>
  <desc>Display window lower left, control window upper right</desc>

  <rect width="1024" height="1024" fill="#f2f0e5" />

  <defs>
    <filter id="display-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#100f0f" flood-opacity="0.16" />
    </filter>
    <filter id="control-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#100f0f" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Output: frameless 16:9 display -->
  <g filter="url(#display-shadow)">
    <rect x="72" y="544" width="672" height="378" rx="52" fill="#100f0f" />
    <rect x="278" y="692" width="260" height="36" rx="18" fill="#fffcf0" fill-opacity="0.38" />
    <rect x="323" y="748" width="170" height="36" rx="18" fill="#fffcf0" fill-opacity="0.22" />
  </g>

  <!-- Control panel -->
  <g filter="url(#control-shadow)">
    <rect x="536" y="84" width="388" height="600" rx="56" fill="#fffcf0" />

    <rect x="580" y="156" width="300" height="40" rx="10" fill="#e6e4d9" />
    <rect x="580" y="156" width="40" height="40" rx="10" fill="#da702c" />

    <rect x="580" y="216" width="300" height="40" rx="10" fill="#e6e4d9" />
    <rect x="580" y="216" width="40" height="40" rx="10" fill="#4385be" />

    <rect x="580" y="276" width="220" height="40" rx="10" fill="#e6e4d9" />
    <rect x="580" y="276" width="40" height="40" rx="10" fill="#3aa99f" />

    <rect x="650" y="456" width="168" height="168" rx="42" fill="#879a39" />
    <polygon points="714,500 714,580 786,540" fill="#fffcf0" />
  </g>
</svg>
